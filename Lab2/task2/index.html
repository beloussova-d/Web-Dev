<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="container">
    <section class="hero-section">
        <h1>Посмотрите, какими моментами из жизни поделились ваши <span class="gradient-text">близкие друзья.</span></h1>
        
        <div class="image-stack">
            <img src="instagram-friends.webp" alt="Story 1" class="card">
        </div>
    </section>

    <section class="login-container">
        <div class="login-card">
            <h2 class="login-title">Войти в Instagram</h2>
            
            <form class="login-form">
                <input type="text" placeholder="Имя пользователя, номер..." aria-label="Username">
                <input type="password" placeholder="Пароль" aria-label="Password">
                <button type="submit" class="btn-primary">Войти</button>
            </form>

            <a href="#" class="link-secondary small">Забыли пароль?</a>

            <div class="divider">
                <span>ИЛИ</span>
            </div>

            <button class="btn-facebook">
                <span class="fb-icon">f</span> Войти через Facebook
            </button>
        </div>

        <div class="signup-card">
            <p>У вас еще нет аккаунта? <a href="#">Создать новый аккаунт</a></p>
        </div>
        
        <div class="meta-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg" alt="Meta" width="60">
        </div>
    </section>
</main>

<footer class="footer">
    <nav class="footer-links">
        <a href="#">Мета</a> <a href="#">Информация</a> <a href="#">Блог</a> <a href="#">Вакансии</a> 
        <a href="#">Помощь</a> <a href="#">API</a> <a href="#">Конфиденциальность</a>
    </nav>
    <div class="footer-copyright">
