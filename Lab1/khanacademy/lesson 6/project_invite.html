<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Event invite</title>
        <style>
            .love {
                color: red;
            }
            .party-image{
                width:100px;
                float: left;
                margin-right: 10px;
                margin-bottom: 5px;
            }
            .info {
                float: right;
                width:30%;
                background-color: lightyellow;
                padding-left: 10px;
            }
        </style>
    </head>
    <body>
        
        <h1>You're invited!</h1>
        <h2>To the party!</h2>
        <img class="party-image" src="https://upload.wikimedia.org/wikipedia/commons/d/dd/Birthday_candles.jpg">
        <p>I'm throwing <span class="love">a party!</span> Feel free to stop by. Let me know if you can make it!</p>
        
        <div class="info">
        <p>The details:</p>
        <ul>
            <li>What: My birthday.</li>
            <li>When: 06.03.26</li>
            <li>Where: My house</li>
        </ul>
        </div>
        
    </body>
</html>
