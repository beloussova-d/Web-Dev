<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>

        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pizza</td>
                    <td>Flour, water, salt, tomato sauce, mozzarella</td>
                    <td>4800 tg</td>
                </tr>
                <tr>
                    <td>Sushi</td>
                    <td>Rice, fish, seaweed</td>
                    <td>2900 tg</td>
                </tr>
                <tr>
                    <td>Hamburger</td>
                    <td>Bun, beef, cheese, tomato, lettuce</td>
                    <td>1290 tg</td>
                </tr>
            </tbody>
        </table>

    </body>
</html>
