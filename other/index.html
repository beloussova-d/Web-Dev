<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="grid">
        <div class="grid-item login-text">
            <img src="facebook-logo.svg" class="img logo" alt="facebook logo">
            <p class="text slogan">Connect with friends and the world around you on Facebook.</p>
        </div>
        <div class="grid-item login-form">
            <form class="form">
                <input type="text" class="input text form-item" name="email" placeholder="Email or phone number"><br>
                <input type="text" class="input text form-item" name="password" placeholder="Password"><br>
                <button class="btn login-btn form-item">Log In</button><br>
                <a href="#" class="link forgot-password text form-item">Forgot password?</a><br>
                <hr class="hr hr-form">
                <button class="btn register-btn text form-item">Create new account</button>
            </form>
            <p class="text create-page"><a class="link create-page text" href="#">Create a Page</a> for a celebrity, brand or business.</p>
        </div>

    </div>
</div>
<footer class="footer">
    <div class="flex">
        <a class="flex-item text link language" href="#">English</a>
        <a class="flex-item text link language" href="#">Русский</a>
        <a class="flex-item text link language" href="#">Қазақша</a>
    </div>
    <hr class="hr hr-footer">
    <div class="flex-container2">
        <a class="flex-item text link language" href="#">English</a>
        <a class="flex-item text link language" href="#">Русский</a>
        <a class="flex-item text link language" href="#">Қазақша</a>
    </div>
    <p class="footer-meta text">Meta © 2026</p>

</footer>
</body>
</html>
